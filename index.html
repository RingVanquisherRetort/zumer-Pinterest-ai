<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160d2c">
<title>Выберите язык | Зумер</title>
<meta name="description" content="Выберите язык сайта Зумер: русский, туркменский, узбекский, таджикский, казахский или кыргызский.">
<link rel="canonical" href="https://zumerai.ru/">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#46216b 0,transparent 42%),#160d2c;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(760px,100%);text-align:center}.brand{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:42px}.mark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ffd34c,#ff8a1c);color:#24133f;margin-right:9px}
h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px;letter-spacing:-1.5px}.sub{color:#c9bbd7;margin:0 0 32px;line-height:1.6}
.languages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.language{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:#fff;background:#ffffff0d;border:1px solid #ffffff24;border-radius:17px;padding:19px;transition:.2s}.language:hover,.language:focus{background:#ffffff19;border-color:#ffbd28;transform:translateY(-2px)}.flag{font-size:30px}.name{font-size:17px;font-weight:800}.native{font-size:12px;color:#bcaecc;margin-top:4px}.arrow{margin-left:auto;color:#ffbd28;font-size:22px}
@media(max-width:480px){.languages{grid-template-columns:1fr}.brand{margin-bottom:32px}}
</style>
<link rel="alternate" hreflang="ru-RU" href="https://zumerai.ru/ru/"><link rel="alternate" hreflang="tk-TM" href="https://zumerai.ru/tk/"><link rel="alternate" hreflang="uz-UZ" href="https://zumerai.ru/uz/"><link rel="alternate" hreflang="tg-TJ" href="https://zumerai.ru/tg/"><link rel="alternate" hreflang="kk-KZ" href="https://zumerai.ru/kk/"><link rel="alternate" hreflang="ky-KG" href="https://zumerai.ru/ky/"><link rel="alternate" hreflang="x-default" href="https://zumerai.ru/"></head>
<body><main>
<div class="brand"><span class="mark">З</span>Зумер</div>
<h1>Выберите язык</h1><p class="sub">На каком языке вам удобнее пользоваться сайтом?</p>
<div class="languages">
<a class="language" onclick="localStorage.setItem('zumer-lang','ru')" href="/ru/"><span class="flag">🇷🇺</span><span><span class="name">Русский</span><br><span class="native">Русский язык</span></span><span class="arrow">↗</span></a>
<a class="language" onclick="localStorage.setItem('zumer-lang','tk')" href="/tk/"><span class="flag">🇹🇲</span><span><span class="name">Туркменский</span><br><span class="native">Türkmen dili</span></span><span class="arrow">↗</span></a>
<a class="language" onclick="localStorage.setItem('zumer-lang','uz')" href="/uz/"><span class="flag">🇺🇿</span><span><span class="name">Узбекский</span><br><span class="native">O‘zbek tili</span></span><span class="arrow">↗</span></a>
<a class="language" onclick="localStorage.setItem('zumer-lang','tg')" href="/tg/"><span class="flag">🇹🇯</span><span><span class="name">Таджикский</span><br><span class="native">Тоҷикӣ</span></span><span class="arrow">↗</span></a>
<a class="language" onclick="localStorage.setItem('zumer-lang','kk')" href="/kk/"><span class="flag">🇰🇿</span><span><span class="name">Казахский</span><br><span class="native">Қазақ тілі</span></span><span class="arrow">↗</span></a>
<a class="language" onclick="localStorage.setItem('zumer-lang','ky')" href="/ky/"><span class="flag">🇰🇬</span><span><span class="name">Кыргызский</span><br><span class="native">Кыргыз тили</span></span><span class="arrow">↗</span></a>
</div></main><script>const saved=localStorage.getItem('zumer-lang');if(saved&&location.pathname==='/')location.replace('/'+saved+'/');</script></body></html>
